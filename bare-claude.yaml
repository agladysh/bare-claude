# Bare Claude Configuration

use: default

presets:
  ollama:
    launcher: ollama
    model: nemotron-3-super:cloud

  default:
    use: ollama
    permissionMode: acceptEdits

  changelog:
    use: default
    quiet: true
    print: true
    read:
      - './README.md'
      - './CHANGELOG.md'
    callToAction: >
      Review the changes from the last version tag,
      research and prepare the CHANGELOG.md entry for the next release.

